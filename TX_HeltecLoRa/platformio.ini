; =============================================
; CANSAT TX — Firmware de vuelo (GPS+BME+MPU+LoRa)
; Plat: ESP32S3 Heltec WiFi LoRa 32 V3
; Sensores: BME280 + MPU6050 + GPS ATGM336H
; Radio: SX1262 / LoRa 915 MHz
; Protocolo: LB135 v2 (USB + LoRa)
; =============================================

[env:cansat_tx]
platform = espressif32@7.1.3
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit MPU6050@^2.2.6
    jgromes/RadioLib@^7.1.2

; LORA_MODO=1 = TX de vuelo (emite LB135 por LoRa)
; LORA_FREQ = 915 MHz (AU915)
; LORA_POWER = 17 dBm
; GPS_MODO=1 = ATGM336H en UART2 (RX=GPIO6 TX=GPIO5)
build_flags =
    -DLORA_MODO=1
    -DLORA_FREC_MHZ=915.0
    -DLORA_POT_DBM=17
    -DLORA_SYNC=0xF3
    -DGPS_MODO=1

; Monitor salida (USB-CDC por CP2102)
; puerto COMx @ 115200
monitor_filters =
    time
