# ═══════════════════════════════════════════════════════════════════════════
#  REGISTRO DE MODELOS — CanSat LB135
# ═══════════════════════════════════════════════════════════════════════════
#  Responde la pregunta más importante del proyecto y que antes NO estaba
#  escrita en ningún lado:
#
#      ¿CUÁL ES EL MODELO QUE VUELA, de dónde salió y cómo se reproduce?
#
#  El repo tenía 12 scripts de entrenamiento, 14 checkpoints .pth, 15 ONNX
#  (más dos "_BACKUP" y dos "_BACKUP2") y 6 exportadores, sin ninguna
#  trazabilidad entre ellos. No había forma de saber qué produjo qué.
#
#  REGLAS
#   1. Todo artefacto que se use en vuelo o en la entrega TIENE que estar acá.
#   2. `metricas` se cita desde outputs/metrics/*.json, nunca de memoria. En el
#      repo convivían cuatro mIoU distintos para el mismo modelo (46.36% en el
#      informe, 52.44% en un print de evaluate_val.py, 0.5317 en un print de
#      train_qat.py y "~0.5317" en un comentario de eval_onnx_gap.py).
#   3. `estado` es uno de: VUELA | POST-VUELO | EXPERIMENTAL | ROTO | ABANDONADO.
#   4. Si un checkpoint no está listado, no se usa.
#
#  ⚠ Los campos marcados con `PENDIENTE` hay que completarlos con datos reales.
#    No se inventaron números para rellenar: un registro con métricas falsas es
#    peor que tener registro.
#
#  ── EMPAQUETADO PARA LA PI ────────────────────────────────────────────────
#  Varios exportadores escribieron los modelos con PESOS EXTERNOS: el `.onnx`
#  de ~0.3 MB NO es autónomo, necesita su `<modelo>.onnx.data` (48-52 MB) al
#  lado. ONNX Runtime (PC) los resuelve; OpenCV DNN (backend de respaldo de la
#  Pi Zero v1, ver cansat/onnxio.py) NO los lee.
#  Para la Pi hay que empotrar los datos:
#      python tools/onnx_inline.py outputs/<modelo>.onnx --out-dir dist_pi/outputs
#  `pi/preparar_deploy.ps1` hace esto automáticamente junto con el copiado.
# ═══════════════════════════════════════════════════════════════════════════

vuelo:
  segmentacion_terreno:
    onnx: "outputs/cansat_seg_terrain_v2.onnx"
    checkpoint: "outputs/best_terrain_v2.pth"
    entrenado_por: "train_terrain_v2.py"
    exportado_por: "python export_onnx.py --arch deeplabv3plus --checkpoint outputs/best_terrain_v2.pth --output outputs/cansat_seg_terrain_v2.onnx --num-classes 5 --img-size 320"
    arquitectura: "DeepLabV3+ MobileNetV2, output stride 8"
    clases: 5
    entrada: "[1, 3, 320, 320]"
    dataset: "LoveDA remapeado (CC BY 4.0)"
    precision: "FP32"
    estado: "VUELA"
    metricas:
      miou: 0.5219
      fuente: "outputs/metrics/val_20260917_192612.json (Val completo, 1669 imgs, seed 42)"
      sha256_16: "7a49d457fa157b19"
      pixel_accuracy: 0.6862
    notas: |
      ⚠ RESUELTO (2026-09-17): el archivo `cansat_seg_terrain_v2.onnx` que volaba
      era, byte a byte, el export del modelo CBAM experimental (mismo MD5 que
      `cansat_seg_terrain_v2_cbam.onnx`, tensores idénticos a
      `best_terrain_cbam.pth`). MODELS.yaml declaraba `best_terrain_v2.pth` pero
      el archivo no correspondía: el modelo que volaba no era el registrado.
      Re-exportado con el exportador canónico y medido en el Val completo:
        52.19 % mIoU (v2 real)  vs  50.34 % (CBAM)  vs  45.76 % (best_model).
      El v2 real es el mejor de los tres: es el que vuela y está registrado.
      Autocontenido (sin .onnx.data), carga en cv2.dnn y en ORT.

    matriz_tamano_entrada:
      # F1.1 (2026-09-18): el v2 entrenado a 320 evaluado a tamaños menores,
      # SIN re-entrenar. Mide cuánto cuesta bajar la resolución de entrada.
      fuente: "outputs/metrics/input_matrix.json (tools/bench_input_sizes.py)"
      modelo_evaluado: "outputs/best_terrain_v2.pth (sha256_16 81c54355bbcf0a19)"
      val: "LoveDA remapeado, 1669 imgs (el mismo de la métrica 0.5219)"
      filas:
        - { size: 320, miou: 0.5220, segundos: 99.3 }
        - { size: 256, miou: 0.4941, segundos: 85.3 }
        - { size: 224, miou: 0.4718, segundos: 91.4 }
        - { size: 192, miou: 0.4400, segundos: 91.5 }
        - { size: 160, miou: 0.4040, segundos: 90.4 }
      notas: |
        La caída a 224 (-5.0 pts) es por DESAJUSTE de escala: el modelo nunca
        vio 224. Los re-entrenos a 224 (F1.2, train_terrain_tiny.py) recuperan
        la mayor parte; el control DeepLabV3+MV2@224 cuantifica cuánto.
        Los segundos son de la RTX 5060 (no de la Pi Zero W): sirven solo para
        ver que el costo de inferencia no depende del tamaño en GPU; en la Pi
        el tiempo escala con el área (320→224 = 2.04× menos píxeles).

  segmentacion_terreno_224:
    # F1.2 (2026-09-18): el mismo backbone del v2 re-entrenado a 224 px.
    # Elimina el desajuste de escala de la matriz (0.4718 era el v2@320 a 224).
    onnx: "outputs/cansat_seg_terrain_v2_224.onnx"
    checkpoint: "outputs/best_terrain_v2_224.pth"
    entrenado_por: "train_terrain_tiny.py --arch deeplabv3plus --size 224 --epochs 30 (2026-09-18)"
    exportado_por: "python export_onnx.py --arch deeplabv3plus --checkpoint outputs/best_terrain_v2_224.pth --output outputs/cansat_seg_terrain_v2_224.onnx --img-size 224"
    arquitectura: "DeepLabV3+ MobileNetV2, output stride 8"
    clases: 5
    entrada: "[1, 3, 224, 224]"
    dataset: "LoveDA remapeado (CC BY 4.0)"
    precision: "FP32 (51.0 MB)"
    estado: "CANDIDATO DE VUELO cv2.dnn (2.04x menos cómputo que el v2@320)"
    metricas:
      miou: 0.4996
      pixel_accuracy: 0.6691
      fuente: "outputs/metrics/v2_224_val.json (Val completo, 1669 imgs, seed 42)"
      comparacion: "v2@320 0.5219 · v2@224 re-entrenado 0.4996 · v2@320 evaluado a 224 0.4718"
    notas: |
      Entrenar a 224 recupera +2.8 pts sobre evaluar el v2@320 a 224 (0.4718).
      Pierde 2.2 pts contra el v2@320 pero cuesta la mitad de cómputo por frame
      (224² = 0.49 × 320²). Pasa auditoría IMX500 a 224 y carga en cv2.dnn.
      Si la medición en la Pi confirma que 320 es muy lento (estimado ~8 s/f),
      éste es el reemplazo directo sin tocar el pipeline (mismo contrato).

  segmentacion_terreno_tiny:
    # F1.2 (2026-09-18): MobileNetV3-Small + LR-ASPP, el candidato NPU.
    onnx: "outputs/cansat_seg_terrain_tiny_224.onnx"
    checkpoint: "outputs/best_terrain_tiny.pth"
    entrenado_por: "train_terrain_tiny.py --arch lraspp-mv3s --size 224 --epochs 30 (2026-09-18)"
    exportado_por: "python export_onnx.py --arch lraspp --checkpoint outputs/best_terrain_tiny.pth --output outputs/cansat_seg_terrain_tiny_224.onnx --img-size 224"
    arquitectura: "MobileNetV3-Small + LR-ASPP (1.08M params)"
    clases: 5
    entrada: "[1, 3, 224, 224]"
    dataset: "LoveDA remapeado (CC BY 4.0)"
    precision: "FP32 (4.3 MB; ~1.1 MB INT8)"
    estado: "CANDIDATO NPU (IMX500) — no cumple el mIoU objetivo en CPU"
    metricas:
      miou: 0.4397
      pixel_accuracy: 0.6241
      fuente: "outputs/metrics/tiny_224_val.json (Val completo, 1669 imgs, seed 42)"
      comparacion: "MV3-S@224 0.4397 · MV2@224 0.4996 · v2@320 0.5219"
    notas: |
      ⚠ NO alcanza el criterio F1 de 0.48 mIoU a 224 (queda en 0.44, -6 pts
      contra el control MV2@224). Su valor es el tamaño: 4.3 MB FP32 / ~1.1 MB
      INT8 entra holgado en el límite de <8 MB del IMX500, y el régimen de ops
      (Conv/HardSwish/HardSigmoid/GlobalAveragePool/Mul/Resize) es el que el
      plan declaró convertible. Falta la verificación real en Edge-MDT (F4).
      Para cv2.dnn en CPU conviene el MV2@224. Si el NPU lo corre a <50 ms, la
      caída de 6 pts puede ser aceptable para cobertura en vuelo.
      Ops verificadas con audit_imx500.py --size 224: pasa.

  alternativas_terreno:
    - nombre: "best_terrain_v2_distilled.pth"
      onnx: "outputs/cansat_seg_terrain_v2_distilled.onnx"
      entrenado_por: "distill_terrain.py (KD de SegFormer-B5)"
      estado: "ALTERNATIVA (no vuela; a 0.23 pts del v2)"
      metricas:
        miou: 0.5196
        fuente: "medido 2026-09-17 sobre el Val completo (mismo split/seed)"
      notas: |
        Empatado estadísticamente con el v2 (52.19 vs 51.96). Se puede volar
        indistintamente; el v2 tiene más historial. El export actual es
        autocontenido y con dynamo=False (antes generaba .onnx.data).
    - nombre: "best_terrain_cbam.pth"
      onnx: "outputs/cansat_seg_terrain_v2_cbam.onnx"
      estado: "EXPERIMENTAL"
      metricas:
        miou: 0.5034
        fuente: "medido 2026-09-17, Val completo"
      notas: "CBAM arranca como identidad (+17k params) pero quedó 1.85 pts abajo."
    - nombre: "best_model.pth"
      onnx: "outputs/cansat_seg_deeplabv3plus_mobilenetv2.onnx"
      estado: "EXPERIMENTAL (base del v2)"
      metricas:
        miou: 0.4576
        fuente: "medido 2026-09-17, Val completo"
      notas: "Es el 46.36 % que citaba el informe viejo: no es el modelo de vuelo."

  dano_principal:
    onnx: "outputs/cansat_damage3_mobilenetv2.onnx"
    checkpoint: "outputs/best_damage3.pth"
    entrenado_por: "train_damage_v2.py --epochs 12 (2026-09-17, split por desastre)"
    exportado_por: "python export_onnx.py --arch damage --num-classes 3 --checkpoint outputs/best_damage3.pth --output outputs/cansat_damage3_mobilenetv2.onnx"
    clases: 3
    nombres_clases: [other, intacto, danado]
    entrada: "[1, 3, 320, 320]"
    dataset: "xBD / xView2"
    licencia: "CC BY-NC-SA 4.0 — obra derivada: NO comercial + compartir igual"
    estado: "VUELA (re-entrenado 2026-09-17; pasa auditoría IMX500)"
    metricas:
      iou_dano_edificios_val_desastres_nuevos: 0.107   # crops nativos 320
      iou_dano_edificios_tile_completo: 0.215          # frame entero → 320 (régimen del vuelo)
      iou_dano_en_script: 0.173                        # 334 tiles de val, crops centrados
      fuente: "A/B 2026-09-17 sobre 40 tiles de hurricane-matthew + palu-tsunami (nunca vistos)"
      comparacion_modelo_viejo: "crops 0.053 · tile completo 0.381 (este último INFLADO por fuga)"
    notas: |
      ⚠ RE-ENTRENADO 2026-09-17 con split POR DESASTRE (`cansat/xbd.py`), 12
      épocas y selección por IoU de daño sobre edificios (la métrica de la
      misión). El modelo anterior entrenaba con 90/10 por FILA: veía ~90 % de
      cada desastre, así que su "0.32 de val" no tenía nada de val. En el A/B
      sobre desastres nunca vistos el nuevo es 2× mejor en crops nativos
      (0.107 vs 0.053); la ventaja del viejo en tile completo (0.381) es
      memorización de esos eventos.
      Honestamente: la generalización a desastres nuevos es MODESTA (~0.1-0.2
      de IoU de daño sobre edificios). El plan para mejorarla está en
      docs/DATASETS-Y-TECNICAS.md (BRIGHT cross-event, más épocas, pérdida
      de RescueNet en el two-stage).

  dano_two_stage:
    # F2 (2026-09-18): el two-stage de VUELO pasó a ser el adaptado a UAV con
    # RescueNet (ver dano_f2_rescuenet). El xBD puro queda como alternativa.
    onnx: "outputs/cansat_damage_v3_bal.onnx"
    checkpoint: "outputs/best_damage_v3_bal.pth"
    entrenado_por: "train_damage_v3.py --epochs 8 --loss rescue --xbd-repeat 4 --extra-manifest dataset/rescuenet_tiles/manifest_train_sub4000.csv (2026-09-18)"
    exportado_por: "python export_onnx.py --arch damage --num-classes 3 --checkpoint outputs/best_damage_v3_bal.pth --output outputs/cansat_damage_v3_bal.onnx --img-size 320"
    clases: 3
    entrada: "[1, 3, 320, 320]"
    dataset: "xBD (split por desastre) + RescueNet (UAV óptico)"
    licencia: "xBD CC BY-NC-SA 4.0 · RescueNet: investigación"
    estado: "VUELA (F2 2026-09-18; pasa auditoría IMX500)"
    metricas:
      iou_dano_rescuenet_val_uav: 0.735    # dominio de vuelo (UAV, GSD 7.7 cm/px)
      iou_dano_xbd_heldout: 0.096          # cross-event satelital (trade-off)
      umbral_voto_uav: 10.2                # F1 0.828 · recall 0.887 (RescueNet val)
      fuente: "val interno de train_damage_v3.py + tools/calibrate_thresholds.py --rescuenet --torch"
    notas: |
      ⚠ CAMBIO DE MODELO DE VUELO (2026-09-18): se reemplazó el two-stage xBD
      (0.472 xBD / 0.497 RescueNet val) por el balanceado xBD×4 + 4k RescueNet
      (0.096 xBD / 0.735 RescueNet val). Motivo: la GSD de vuelo (7.7 cm/px a
      250 m) es del dominio UAV, no satelital; el usuario priorizó detectar
      daño en el dominio de vuelo. Umbral de voto recalibrado en RescueNet val
      (10.2 %, F1 0.828, recall 0.887). El xBD puro sigue en
      `outputs/cansat_damage_v3.onnx` como referencia cross-event del informe.
      El two-stage se enmascara con los edificios del terreno (recall 84 %).

  dano_f2_rescuenet:
    # F2 (2026-09-18): mezcla con RescueNet (UAV óptico, GSD ≈0.05-0.08 m/px,
    # el régimen del vuelo: 7.7 cm/px a 250 m) vs el modelo xBD-only.
    preparacion: |
      RescueNet (4494 imgs UAV 3000×4000, Hurricane Michael) → 3 clases con
      `prepare_rescuenet.py`: 17 560 tiles de train + 2 093 de val a 640²,
      remapeo other={fondo,agua,vehículo,rutas,árbol,pileta}, intacto={sin
      daño}, dañado={menor,mayor,destrucción total}. El entrenamiento acepta
      manifests extra: `train_damage_v3.py --extra-manifest ... --xbd-repeat N`.
    resultados:
      - nombre: "xBD-only (el que vuela hoy)"
        checkpoint: "outputs/best_damage_v3.pth"
        onnx: "outputs/cansat_damage_v3.onnx"
        iou_dano_xbd_heldout: 0.472
        iou_dano_rescuenet_val: 0.497
        fuente: "metadata del checkpoint (xBD) + tools/eval_damage_manifests.py (RescueNet)"
      - nombre: "Mezcla 82 % RescueNet (especialista UAV)"
        checkpoint: "outputs/best_damage_v3_uav.pth"
        iou_dano_xbd_heldout: 0.004
        iou_dano_rescuenet_val: 0.686
        nota: "olvida por completo el dominio satelital (xBD)"
      - nombre: "Balanceado xBD×4 + 4k RescueNet"
        checkpoint: "outputs/best_damage_v3_bal.pth"
        onnx: "outputs/cansat_damage_v3_bal.onnx"
        iou_dano_xbd_heldout: 0.096
        iou_dano_rescuenet_val: 0.735
        nota: "ELEGIDO para volar (two-stage de vuelo)"
      - nombre: "Principal (damage3) re-entrenado con la mezcla"
        checkpoint: "outputs/best_damage3_bal.pth"
        iou_dano_xbd_heldout: 0.047          # protocolo v2 (media por muestra)
        iou_dano_rescuenet_val: 0.476        # protocolo v2 (centro 320)
        nota: "DESCARTADO: peor que el principal xBD en ambos dominios
               (xBD 0.173 → 0.047). Entrenamiento cortado en época 1."
    calibracion_uav:
      herramienta: "tools/calibrate_thresholds.py --rescuenet --tiles 600 --torch --min-dano-px 10"
      two_stage_balanceado:
        umbral_f1_optimo: 10.18
        f1: 0.828
        precision: 0.776
        recall: 0.887
        fpr: 0.415           # sobre val de zona de desastre (tiles "limpios" con escombros)
        umbral_fpr_5pct: 83.55
      principal_xbd:
        umbral_f1_optimo: 10.89
        f1: 0.772
        recall: 0.927
        fpr: 0.769
        nota: "SATURA en UAV: mediana 62.7 % de 'daño' en tiles sin daño. En
               vuelo no discrimina; el two-stage es el que decide."
    interpretacion: |
      Los dominios satelital (0.3 m/px) y UAV (0.05-0.08 m/px) compiten:
      agregar RescueNet sube el daño en UAV de 0.497 → 0.735 pero hunde xBD de
      0.472 → 0.096. DECISIÓN 2026-09-18 (usuario): vuela el mejor detector en
      el dominio de vuelo → two-stage balanceado, umbral 10.2 % (prioriza
      detección: recall 0.887). El xBD-only queda como referencia cross-event.
      El balanceado pasa la auditoría IMX500 (opset 17, 51 MB, autocontenido).
    caveat: |
      El 0.735 de RescueNet val puede estar inflado por proximidad geográfica
      entre train y val del propio dataset (mismos vuelos post-Michael). El
      número cross-dataset honesto es el de xBD held-out. El FPR del umbral
      de vuelo (41.5 %) se midió sobre val de zona de desastre: recalibrar con
      frames reales del predio (--folder/--labels) antes de la campaña.

  dano_siames:
    onnx: "outputs/cansat_siamese_damage.onnx"
    checkpoint: "outputs/best_siamese_damage.pth"
    entrenado_por: "train_siamese_damage.py --epochs 10 --neg-frac 0.3 --export"
    entrada: "dos tensores [1,3,320,320]: 'pre' y 'post'"
    dataset: "xBD / xView2 (pares pre/post)"
    licencia: "CC BY-NC-SA 4.0"
    estado: "RE-ENTRENADO 2026-09-17 — opcional, desactivado por defecto"
    metricas:
      iou_dano_two_stage: 0.601
      dano_con_pre_igual_post: 0.0123   # media de píxeles 'dañado' con pares idénticos
      dano_max_pre_igual_post: 0.0651
      fuente: "autochequeo del propio script + Val (mismo split por fila)"
    notas: |
      Los pesos viejos alucinaban daño sin cambio (5.5 % medio, máx 63.6 %) y
      se usaban en el consenso: el 27.1 % de daño del frame 4191 de la
      telemetría guardada salía de ahí. Re-entrenado con pares NEGATIVOS
      sintéticos (--neg-frac 0.3: pre==post ⇒ edificios intactos) y el
      autochequeo bajó a 1.23 % medio / 6.5 % máx.
      Aun así el pipeline lo mantiene DESACTIVADO por defecto (--siamese-onnx
      para activarlo): 1.2 % de falsos positivos por frame sigue ensuciando un
      consenso que trabaja con umbrales de ~10 %, y el "pre" de vuelo es un
      tile satelital nadir contra frames oblicuos (cambio de dominio fuerte).
      Backup de los pesos ROTO: outputs/_roto_backup/.

  flood_specialist:
    # F3 (2026-09-18): el de vuelo pasó a 224 px (mitad de cómputo, IoU flood
    # igual o mejor). El de 320 queda como alternativa.
    onnx: "outputs/cansat_flood_specialist_224.onnx"
    checkpoint: "outputs/best_flood_specialist_224.pth"
    entrenado_por: "train_flood_specialist.py --epochs 12 --size 224 (2026-09-18)"
    exportado_por: "el propio script exporta el BEST con dynamo=False"
    dataset: "FloodNet (Kaggle) + LoveDA"
    licencia: "FloodNet sin licencia declarada en la ficha — verificar"
    estado: "VUELA (224 px; el de 320 queda como alternativa)"
    metricas:
      iou_flood: 0.489          # vs 0.483 a 320 px
      iou_agua_normal: 0.502    # vs 0.555 a 320 px (baja: trade-off)
      iou_other: 0.876          # vs 0.881 a 320 px
      fuente: "mejor época del entrenamiento (Val, split 80/20 del remapeo)"
    notas: |
      ⚠ RE-ENTRENADO A 224 px (2026-09-18): IoU flood 0.489 (vs 0.483 a 320) y
      **2.04× menos cómputo por frame** en la Pi. La clase agua-normal baja
      (0.555 → 0.502): es el precio del tamaño. El pipeline preprocesa por
      modelo (mission_pipeline: size_f = sess_f.size_px) así que el flood puede
      correr a 224 aunque el terreno/daño vayan a 320.
      El modelo de 320 sigue en outputs/cansat_flood_specialist.onnx.
      Historia previa: el modelo anterior era INSERVIBLE (shift heurístico en
      prepare_floodnet.py: "flood" era Building-NON-flooded y "agua normal" era
      Tree). Con el remapeo oficial (flood = {Building-flooded, Road-flooded},
      agua = {Water}) es el primer modelo del repo que PASÓ la auditoría IMX500.

  fuego_humo:
    # F3 (2026-09-18): extensión — el DPD no la exige, pero suma alerta temprana.
    onnx: "outputs/cansat_fire_smoke.onnx"
    checkpoint: "outputs/best_fire_smoke.pth"
    entrenado_por: "train_fire_smoke.py --epochs 30 (init encoder desde best_terrain_v2.pth)"
    exportado_por: "el propio script exporta el BEST con dynamo=False"
    dataset: "fire_smoke_seg (LibreYOLO/fire-smoke-seg, derivado de FLAME, CC BY 4.0)"
    entrada: "[1, 3, 256, 256]"
    clases: 3
    nombres_clases: [other, fuego, humo]
    estado: "VUELA (opcional; se apaga con --no-damage o si falta el ONNX)"
    metricas:
      iou_fuego_valid: 0.806
      iou_humo_valid: 0.718
      iou_fuego_test: 0.791      # test split (20 imgs, nunca usado en selección)
      iou_humo_test: 0.774
      media_test: 0.782
      falso_positivo_fuego: "0.00 % en LoveDA urbano/rural y RescueNet"
      falso_positivo_humo: "mediana 2.45 % en rural (máx 15.01 %)"
      fuente: "validación interna + eval en el test split con el checkpoint BEST"
    notas: |
      Extensión F3: 141 pares de entrenamiento (256², polígonos de FLAME vía
      Roboflow, CC BY 4.0), encoder inicializado desde el terreno v2 (dominio
      aéreo). Supera el objetivo del plan (fire IoU ≥0.40): 0.79 en test.
      Alertas en cansat/indices.py: fuego >1 % (FIRE_ALERT_PCT) y humo >30 %
      (SMOKE_ALERT_PCT), con margen medido contra escenas sin incendio.
      Telemetría: columnas fire_pct/smoke_pct (CSV 31 columnas) + reglas
      INCENDIO/HUMO EXTENSO en el diagnóstico. La estación las lee
      (web_server CSV_COLUMNS + types.ts) y el demo las simula.

  severidad:
    # F2b (2026-09-18): 5 niveles para medir la fracción de colapso (el
    # "según su magnitud" del DPD) y reemplazar el supuesto 0.3 de casualties.
    onnx: "outputs/cansat_severity.onnx"
    checkpoint: "outputs/best_severity.pth"
    entrenado_por: "train_severity.py --epochs 10 + --resume --epochs 15 (mejor época 12)"
    exportado_por: "python export_onnx.py --arch damage --num-classes 5 --checkpoint outputs/best_severity.pth --output outputs/cansat_severity.onnx --img-size 320"
    arquitectura: "DeepLabV3+ MobileNetV2, 5 clases"
    clases: 5
    nombres_clases: [other, intacto, menor, mayor, destruido]
    entrada: "[1, 3, 320, 320]"
    dataset: "RescueNet (máscaras originales de severidad, recortadas por las coordenadas del nombre del tile)"
    licencia: "RescueNet: investigación"
    estado: "VUELA (opcional; si está, el colapso de casualties es MEDIDO)"
    metricas:
      iou_colapso_edificios: 0.633    # (mayor + destruido) sobre edificios — alimenta casualties
      iou_intacto: 0.584
      iou_menor: 0.385
      iou_mayor: 0.415
      iou_destruido: 0.550
      fuente: "mejor época (12) del val de RescueNet (2093 tiles)"
    notas: |
      La fracción de colapso medida es (mayor+destruido)/(cualquier edificio)
      del frame; el pipeline la pasa a `casualties.estimar(...,
      collapse_frac_medido=...)` y la telemetría registra `colapso_pct` +
      `colapso_fuente` ("medido"/"supuesto"). Entrenamiento en dos corridas
      (10 épocas + resume 15, mejor época 12; ~10 min/época porque decodifica
      las imágenes originales 3000×4000). El ONNX pasa la auditoría IMX500.
      ALTERNATIVA MULTI-DESASTRE (2026-09-19): `outputs/cansat_severity_multi.onnx`
      (checkpoint `best_severity_multi.pth`) = fine-tune del anterior con
      RescueNet (1500) + **CRASAR** (1086 tiles de 10 desastres sUAS: tornado
      Mayfield, volcán Kilauea, incendio Mussett, huracanes, colapso).
      Época 1: **RescueNet 0.578 / CRASAR test 0.32** — gana en tipos de
      desastre nuevos a cambio de ~5 pts en RescueNet. El de vuelo sigue siendo
      el RescueNet-only (0.633); este queda como alternativa multi-desastre
      (entrenamiento cortado en época 1: cada época tarda ~8 min).

  tipo_desastre:
    # F2 v3 (2026-09-19): clasificador de tipo de desastre (extensión).
    onnx: "outputs/cansat_disaster_type.onnx"
    checkpoint: "outputs/best_disaster_type.pth"
    entrenado_por: "train_disaster_type.py --epochs 12"
    arquitectura: "MobileNetV3-Small (7 clases)"
    clases: 7
    nombres_clases: [huracan, inundacion, sismo, incendio, volcan, tornado, otro]
    entrada: "[1, 3, 224, 224]"
    dataset: "xBD + RescueNet + KATE-PD + CRASAR (etiqueta de EVENTO como supervisión débil)"
    estado: "OPCIONAL (pista de contexto; no altera el diagnóstico)"
    metricas:
      acc_val: 0.978
      loeo_media_ponderada: 0.248
      loeo_eventos: "15 (leave-one-event-out, 6 épocas por fold, 3 306 tiles)"
      caveat: "⚠ El 0.978 es con split ALEATORIO (no por evento): tiles del
               mismo evento caen en train y val → fuga. La métrica honesta es
               LOEO (leave-one-event-out): 0.248 ponderada. Solo los INCENDIOS
               generalizan (socal-fire 0.755, santa-rosa 0.712); huracanes
               0.10-0.18, inundaciones 0.00-0.06, sismo 0.03-0.28, CRASAR
               0.00-0.30. Es una pista de contexto, NO un clasificador
               confiable en eventos nuevos. Ver outputs/disaster_type_loeo.json."
      loeo_json: "outputs/disaster_type_loeo.json"
      muestras: "3 355 balanceadas (huracán 1200, incendio 907, sismo 796,
                 inundación 355, volcán 41, otro 56, tornado 0 — Mayfield es
                 test y sus ortomosaicos grandes se bajaron después)"
    notas: |
      Etiqueta el TIPO de desastre del frame (huracán/inundación/sismo/incendio/
      volcán/tornado/otro) a partir de la etiqueta del EVENTO — es una pista de
      contexto, no una clasificación fina. Integrado en el pipeline
      (`--type-onnx`, opcional) y en el JSONL como `tipo_desastre`/`tipo_conf`.
      Pasa la auditoría IMX500 y carga en cv2.dnn.
      LOEO (`train_disaster_type.py --loeo`) confirma que en eventos NO vistos
      el modelo no es confiable salvo para incendios: usarlo solo como etiqueta
      débil y con la confianza a la vista.

  deteccion_personas:
    pesos: "models/yolov8n_visdrone.pt"
    framework: "ultralytics"
    conf: 0.25
    imgsz: 1280
    clases_persona: [0, 1]        # pedestrian, people (VisDrone)
    clases_vehiculo: [2, 3, 4, 5, 6, 7, 8]
    estado: "VUELA en PC/post-vuelo (desactivable con --no-detect)"
    metricas:
      comparacion_modelos: "2026-09-17 sobre dataset/pruebas/PERSONAS_AUTOS.png @1280: VisDrone 254 personas / COCO yolov8s 42 personas"
      v2_yolo11n_val: "2026-09-19: mAP50-95 0.164 · mAP50 0.295 (548 imgs / 38 759 instancias, val completo de VisDrone)"
      precision_recall: "medido en val de VisDrone (v2); en la imagen de prueba los tres modelos dan ~250 personas"
    notas: |
      ⚠ CAMBIO 2026-09-17: el detector por defecto pasó de `yolov8s.pt` (COCO)
      al fine-tune de **VisDrone** (`yolov8n_visdrone.pt`, 5.9 MB). Medición
      directa: en una imagen aérea de prueba el VisDrone detecta 254 personas
      contra 42 del COCO — los modelos COCO pierden personas sub-píxel, que es
      exactamente el caso del CanSat (a 250 m, 1 persona ≈ 6 px).
      `yolo11n_visdrone.pt` da casi lo mismo (251) y queda como alternativa.
      **v2 (2026-09-19)**: `yolo11n_visdrone_v2.pt` re-entrenado 40 épocas con
      paciencia 15 (mAP50-95 0.164 en el val completo). El ONNX
      (`models/yolo11n_visdrone_v2.onnx`) está listo para convertir a `.rpk`
      con Ultralytics `format="imx"` — **requiere Linux** (en Windows falla con
      "Export only supported on Linux"; verificado).
      En la Pi Zero v1 (ARMv6, sin torch) la detección va por el NPU del
      AI Camera (--det-backend imx500); el SSD COCO on-sensor tiene la misma
      limitación de personas chicas y hay que medirlo en la placa.
      En tiles satelitales (0.3 m/px) las personas siguen siendo sub-píxel: los
      conteos de simulacros sobre LoveDA NO son significativos.

post_vuelo:
  segformer_b5:
    onnx_preferido: "outputs/cansat_seg_terrain_segformer_b5_512.onnx"
    onnx_alternativo: "outputs/cansat_seg_terrain_segformer_b5_320.onnx"
    checkpoint: "outputs/best_terrain_segformer_b5.pth"
    entrenado_por: "train_segformer_b5.py (2 etapas: 320px y luego 512px)"
    exportado_por: "python export_onnx.py --arch segformer --checkpoint outputs/best_terrain_segformer_b5.pth --img-size 512 --output outputs/cansat_seg_terrain_segformer_b5_512.onnx"
    entrada: "[1, 3, 512, 512]"
    dataset: "LoveDA remapeado (CC BY 4.0)"
    estado: "POST-VUELO"
    metricas:
      miou: "PENDIENTE"
    notas: |
      ⚠ post_flight.py apuntaba a cansat_seg_terrain_segformer_b5_640.onnx, que
      NO existe, y por eso TODA la segunda pasada se salteaba en silencio sin
      ningún warning. Ahora resuelve el primero disponible entre 512/320/640 y
      lee el tamaño de entrada del propio ONNX.
      El _640 no existe porque export_b5_640.py estaba roto: cargaba
      best_terrain_b5.pth (no existe; el real es best_terrain_segformer_b5.pth)
      e instanciaba SegformerTerrain (clase inexistente). Si se quiere el 640,
      usar el export_onnx.py unificado.
      El .onnx viene con pesos externos (.onnx.data de 338 MB): audit_imx500.py
      lo marca como problema para el conversor IMX500.

  super_resolucion:
    modelo: "models/EDSR_x2.pb"
    algoritmo: "edsr (cv2.dnn_superres)"
    factor: 2
    origen: "https://github.com/Saafke/EDSR_Tensorflow"
    licencia: "ver el repo de origen"
    estado: "POST-VUELO"
    notas: |
      Requiere OpenCV CONTRIB (cv2.dnn_superres), que NO estaba declarado en
      requirements.txt. enhance_image.py ya no lo descarga en runtime: sin red
      en vuelo eso rompía el post-vuelo justo en el paso que genera las imágenes
      "mejoradas con IA" que pide el DPD. Precargar en models/ antes de viajar.

# ── Validación INT8 (umbrales que publica el informe) ──────────────────────
# Los usa validate_int8_mission.py; antes el docstring decía que "los publica
# MODELS.yaml" pero no estaban en ningún lado.
validacion_int8:
  umbrales:
    acuerdo_pixel: 0.95
    acuerdo_veredicto: 0.95
    acuerdo_alerta: 1.00
  estado_2026_09_17: "NO DEPLOYABLE en la Pi objetivo"
  mediciones:
    acuerdo_pixel_medio: 0.905
    acuerdo_pixel_min: 0.665
    miou_fp32: 0.4595
    miou_int8: 0.4315
    fuente: "medición read-only del 2026-09-17 (20 frames Val, indicativa)"
  notas: |
    Los `*_int8.onnx` que existen son cuantización DINÁMICA (quantize_all.py):
    · OpenCV DNN NO los carga (opcode DynamicQuantizeLinear no soportado, ni en
      OpenCV 5.0) → inútiles para la Pi Zero v1.
    · Con ORT son 23-26× MÁS LENTOS que FP32 en CPU (ConvInteger sin kernels
      optimizados) y el acuerdo no llega al 95 %.
    · El único camino INT8 viable es QDQ estático (quantize_onnx.py, nunca
      ejecutado) verificado en la placa. Hasta entonces: FP32.

