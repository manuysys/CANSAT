; Emisor UART del contrato LB135 v2. Un solo src/main.cpp para todas las
; placas: el sketch no usa nada específico de la Heltec, sólo Serial.
;
;  · heltec_wifi_lora_32_V3 : Heltec V3 (USB nativo; Serial = USB-CDC).
;  · esp32s3_ch340         : ESP32-S3 genérica/clon con chip puente CH340
;                            (Serial = UART0 GPIO43/44 → /dev/ttyUSB0 en la Pi).

[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200

[env:esp32s3_ch340]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Clones S3 con CH340 sin auto-reset: cargar a 115200 y entrar a bootloader a
; mano (mantener FLASH/BOOT, pulsar RST, soltar FLASH). PlatformIO agrega
; --before default_reset y pisa el flag: para estos clones conviene flashear
; con esptool directo (ver el README de la carpeta).
upload_speed = 115200

[env:esp8266_ch340]
; Placa NodeMCU/Wemos (ESP-12) con CH340 — el chip que se midió acá responde
; como ESP8266. Mismo main.cpp: sólo usa Serial a 115200 (UART0 → CH340).
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 115200
