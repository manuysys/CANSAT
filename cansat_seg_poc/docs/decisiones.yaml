# ═══════════════════════════════════════════════════════════════════════════
#  Decisiones de diseño y limitaciones conocidas — CanSat LB135
# ═══════════════════════════════════════════════════════════════════════════
#  ESTE ARCHIVO ES LA FUENTE. generate_report.py lo lee para armar
#  docs/reporte_pruebas.md.
#
#  Antes estas dos listas estaban HARDCODEADAS adentro de generate_report.py,
#  que se presentaba como "documento vivo: re-generar tras cada tanda de
#  pruebas". O sea que el informe se regeneraba pero las secciones 5 y 6 decían
#  siempre lo mismo, aunque la lógica hubiera cambiado. Los números citados ahí
#  (el 87.6% de la cuantización, los umbrales USI>3) estaban escritos a mano en
#  un string y no salían de ninguna medición.
#
#  Regla: si cambia una decisión, se cambia ACÁ. Lo que se pueda medir
#  (métricas, conteos de evidencia) lo calcula generate_report.py en runtime y
#  NO debe escribirse acá.
# ═══════════════════════════════════════════════════════════════════════════

modelo_vuelo:
  arquitectura: "DeepLabV3+ MobileNetV2 (output stride 8, ASPP, decoder stride-4)"
  clases: 5
  nombres_clases: [vegetation, building, water, bare_ground, other]
  entrada: "[1, 3, 320, 320]"
  onnx: "outputs/cansat_seg_terrain_v2.onnx"
  checkpoint: "outputs/best_terrain_v2.pth"
  miou_val_completo: 0.5219
  precision_vuelo: "FP32"
  nota_precision: |
    FP32 confirmado por medición: los `*_int8.onnx` existentes son cuantización
    DINÁMICA, que ni siquiera carga en OpenCV DNN (opcode DynamicQuantizeLinear)
    y con ORT es 23-26× MÁS LENTA que FP32 en CPU. Detalle en MODELS.yaml →
    validacion_int8. El único camino INT8 viable es QDQ estático verificado en
    la placa.
  nota_modelo: |
    ⚠ El ONNX que volaba era el export del modelo CBAM experimental, no el v2
    registrado (mismo MD5 que `_cbam.onnx`). Re-exportado del checkpoint
    correcto el 2026-09-17: 52.19 % mIoU (v2) vs 50.34 % (CBAM) vs 45.76 %
    (best_model) sobre el Val completo. El v2 es el que vuela.

decisiones:
  - id: onnx-export
    estado: vigente
    texto: |
      Exportación ONNX con dynamo=False y sin dynamic_axes (requisito del
      conversor Sony IMX500). audit_imx500.py ahora valida de verdad contra
      estos requisitos y devuelve exit code != 0 si algo no cumple; antes sólo
      imprimía el opset y el recuento de operadores.
      Nota histórica: antes sólo export_onnx.py y export_b5_640.py pasaban
      dynamo=False; los otros cuatro eran shims que se eliminaron el 2026-09-21
      (junto con evaluate_val/eval_onnx_gap/eval_int8_cpu/crf_refine), y los
      hints de mission_pipeline.py ya apuntan al exportador canónico.
      Unificado en cansat/onnxio.py + export_onnx.py. Además, audit_imx500.py ya
      no marca "pesos externos" por la mera presencia de un .onnx.data suelto:
      mira el grafo (data_location=EXTERNAL).

  - id: perdidas-humanas
    estado: vigente
    texto: |
      La estimación de pérdidas humanas del DPD es un modelo de EXPOSICIÓN con
      supuestos declarados (cansat/casualties.py): densidad poblacional × área
      relevada × ocupación × fracción dañada, y luego × colapso × letalidad.
      Se publica con banda ×0.5-×2 y los supuestos van en la telemetría. NO es
      una predicción de víctimas y así debe presentarse.

  - id: gps
    estado: vigente
    texto: |
      El protocolo LB135 v2 lleva lat/lon como campos opcionales al final
      (junto a danado_pct), así un receptor viejo los ignora. La Pi recibe la
      posición de la ESP32 por UART y la asocia a cada frame; la estación
      dibuja la trayectoria sin basemap (offline).

  - id: deteccion-personas
    estado: vigente
    texto: |
      En la Pi Zero v1 (ARMv6) no hay ultralytics/torch: la detección de
      personas va por el NPU del AI Camera (IMX500, --det-backend imx500) o se
      apaga (--no-detect). En PC/post-vuelo sigue YOLOv8s@1280. El modo IMX500
      está implementado contra la API oficial de picamera2 y PENDIENTE de
      validación en hardware.

  - id: siames
    estado: vigente
    texto: |
      El siamés queda DESACTIVADO por defecto en vuelo (--siamese-onnx para
      activarlo). Los pesos viejos alucinaban daño sin cambio (5.5 % medio,
      máx 63.6 %) y contaminaban el consenso (27.1 % de daño falso en el frame
      4191 de la telemetría guardada). Re-entrenado con pares negativos bajó a
      1.23 % medio / 6.5 % máx; aun así el "pre" de vuelo es un tile nadir
      contra frames oblicuos: cambio de dominio fuerte.

  - id: flood-remapeo
    estado: vigente
    texto: |
      prepare_floodnet.py remapeaba con un `shift` heurístico que desplazaba
      TODAS las clases: "flood" era Building-NON-flooded y "agua normal" era
      Tree. Corregido contra el class_mapping.csv oficial (flood = clases 1 y
      3; agua = 5) y el especialista fue re-entrenado (IoU flood 0.483). Es el
      primer modelo del repo que pasa la auditoría IMX500.

  - id: opset
    estado: vigente
    texto: "Opset 17, entrada fija [1,3,320,320], salida 'logits'."

  - id: contrato-telemetria
    estado: vigente
    texto: |
      El CSV de telemetría creció de 23 a 29 columnas con las extensiones del
      DPD, SIEMPRE al final para no romper consumidores viejos (DictReader):
        lat, lon, hum_pct, area_m2, personas_afectadas, perdidas_est.
      La humedad cierra el gap del BME280 (el DPD la mide y no viajaba);
      protocol.py la lleva como campo 23 opcional del paquete v2.
      La estación (web_server.CSV_COLUMNS + types.ts Frame) las conoce y
      degrada elegantemente si faltan (CSV viejo).

  - id: umbrales-dano
    estado: vigente
    texto: |
      Umbral de voto del consenso de daño: 10 % (DAMAGE_CONSENSUS_PCT).
      CALIBRADO el 2026-09-17 con tools/calibrate_thresholds.py sobre xBD con
      split por desastre (120 tiles de hurricane-matthew + palu-tsunami, nunca
      vistos): el óptimo medido es 11.8 % (F1 0.77, FPR 4.3 %). El 10 % del
      repo queda dentro del margen y se mantiene como default; el pipeline lo
      expone como --damage-threshold para recalibrar con frames del predio.
      Frames sin desastre: daño mediano 1.1 %, p95 10.7 %. Con desastre:
      mediana 22.8 %, p95 49.3 %.

  - id: detector
    estado: vigente
    texto: |
      Detector de personas: fine-tune de VisDrone (models/yolov8n_visdrone.pt)
      con conf=0.25 e imgsz=1280. CAMBIO 2026-09-17: antes era yolov8s COCO.
      Medición sobre dataset/pruebas/PERSONAS_AUTOS.png @1280: VisDrone 254
      personas vs COCO 42 — los modelos COCO pierden personas sub-píxel, que es
      el caso del CanSat (a 250 m, 1 persona ≈ 6 px). Los IDs de clase se
      resuelven desde model.names en runtime (presets COCO/VisDrone).
      En la Pi Zero v1 la detección va por el NPU del AI Camera
      (--det-backend imx500, SSD COCO on-sensor): misma limitación de personas
      chicas, PENDIENTE de medir en la placa.

  - id: int8
    estado: pendiente
    texto: |
      Cuantización INT8: decisión PENDIENTE DE RE-MEDICIÓN. La anterior
      ("descartada para vuelo, coincidencia 87.6% < umbral 95%") se basó en una
      medición inválida; ver modelo_vuelo.nota_precision. Se vuela en FP32 hasta
      re-medir. Adicionalmente, quantize_all.py usa quantize_dynamic, que en una
      CNN sólo cuantiza pesos: el "~2x más rápido" que prometía su docstring no
      es realista, y los artefactos ni cargan en cv2.dnn.

  - id: veredictos
    estado: vigente
    texto: |
      Veredictos ambientales unificados en cansat/indices.py. Regla actual:
        1. SIN DATOS            si menos del 5% de los píxeles son válidos
        2. SUELO EXPUESTO       si GVI < -0.5 y veg < 10% y USI <= 1 y agua < 25%
        3. ALTO ESTRÉS URBANO   si USI > 3
        4. ESTRÉS MODERADO      si USI > 1
        5. ZONA SALUDABLE       en otro caso
      Los umbrales de USI no cambiaron (3.0 / 1.0). Sí cambió el orden: antes
      SUELO EXPUESTO se evaluaba al final y era prácticamente inalcanzable,
      porque un terreno pelado con 2% de edificios ya daba USI > 1 y caía en
      ESTRÉS MODERADO. Se agregaron dos guards que el código original sólo tenía
      en su comentario ("sin verde y sin ciudad"): el de ciudad (USI <= 1) y el
      de agua (< 25%), porque GVI no distingue un lago de tierra desnuda.

  - id: nodata
    estado: vigente
    texto: |
      Los porcentajes de terreno ignoran píxeles sin datos. Desde la auditoría,
      "sin datos" es sólo el negro CONTIGUO AL BORDE (cansat/nodata.py
      border_mask), no cualquier píxel oscuro: el umbral global de luminancia
      descartaba sombras, asfalto oscuro y agua profunda de los frames de cámara
      real, y sobre ese remanente se calculaban porcentajes, USI, veredicto,
      sampler y alerta. Con --camera el umbral pasa a 0 automáticamente.

  - id: descenso
    estado: vigente
    texto: "Perfil de descenso del simulador alineado al DPD: eyección ~250 m, descenso 2-4 m/s."

  - id: nomenclatura-gvi
    estado: vigente
    texto: |
      Lo que se llamaba "NDVI" se renombra GVI (Greenness / Verdor Index). No
      hay banda NIR en una cámara RGB, así que no es NDVI, y presentarlo como
      tal ante CONAE era un riesgo de credibilidad evitable. La columna de
      telemetry.csv sigue siendo `ndvi` para no romper el contrato publicado; el
      campo canónico es `gvi` y ambos llevan el mismo valor. El glosario del
      frontend (web-app/src/lib/vocab.ts) se actualizó en consecuencia.

  - id: consenso-dano
    estado: vigente
    texto: |
      El diagnóstico de daño es mayoría simple de los modelos disponibles sobre
      10% de superficie dañada, más una red de seguridad si dos modelos ven
      >25%. Antes la condición era `pct_dan > 10 and votos >= 2` con `votos`
      incluyendo a `pct_dan > 10`, o sea que el modelo principal tenía veto: si
      decía 9% y los otros dos 80%, no había alerta. Y la UI anunciaba "consenso
      de 3 modelos".

  - id: stress-suite
    estado: vigente
    texto: |
      Aptitud de vuelo MEDIDA con corrupción sintética (tools/stress_suite.py +
      cansat/corrupt.py; 120 imgs/terreno-daño, 80 flood, 60 fuego; seed 42,
      severidad fija declarada en el módulo; JSON: outputs/stress_suite.json).
      mIoU limpio → estresado:
        · Terreno (LoveDA Val, cansat_seg_terrain_v2): 51.0 % → lluvia 20.2 %,
          niebla 16.3 %, motion_blur 43.1 %, subexp 44.9 %, sobreexp 29.3 %,
          escala 50.2 %.
        · Daño xBD held-out (Joplin/Nepal, cansat_damage3): IoU bin 0.142 →
          lluvia 0.073, niebla 0.069, motion 0.091, subexp 0.121, sobreexp 0.069,
          escala 0.159.
        · Daño two-stage de vuelo (RescueNet val, cansat_damage_v3_bal):
          IoU bin 0.403 → lluvia 0.334, niebla 0.198, motion 0.350, subexp 0.356,
          sobreexp 0.278, escala 0.374.
        · Flood (FloodNet val 80 imgs, especialista 224): IoU inundación 0.489 →
          lluvia 0.256, niebla 0.319, motion 0.488, subexp 0.418, sobreexp 0.348,
          escala 0.493.
        · Fuego (fire_smoke valid+test 60 imgs; el valid seleccionó el
          checkpoint, se declara): IoU fuego 0.801 → lluvia 0.306, niebla 0.787,
          motion 0.706, subexp 0.642, sobreexp 0.595, escala 0.761.
      Lectura honesta: niebla y lluvia son las degradaciones dominantes en
      terreno y daño (la niebla más que duplica el error del two-stage); en flood
      manda la lluvia (−0.233) y en fuego la lluvia es catastrófica (−0.495)
      mientras la niebla casi no afecta (humo ≈ niebla para el modelo). Las
      exposiciones afectan moderado; el jitter de escala casi no afecta porque
      el resize al input normaliza. Son corrupciones SINTÉTICAS: miden robustez
      relativa del mismo modelo contra sí mismo, no reemplazan validación de
      vuelo real.

  - id: consulta-terrestre
    estado: vigente
    texto: |
      Consulta Terrestre en la estación: consultas espaciales simbólicas sobre
      las máscaras de clase por frame. El post-vuelo ahora las persiste en
      entrega/masks/ (PNG gris de índices, 255 = sin dato; se apaga con
      --no-masks y suma el bucket del contrato v3). Motor: cansat/consultas.py
      (plantillas en español e inglés → área, conteo con buffer métrico,
      fracción de longitud por esqueleto, distancia, existencia y personas).
      NO hay LLM como respondedor: lo que no mapea devuelve "consulta no
      soportada" con sugerencias. El servidor de la estación lo invoca por
      subproceso (tools/consulta.py), así sigue siendo stdlib-only.
      Georreferenciado declarado APROXIMADO: cuadrado de lado sqrt(area_m2)
      centrado en (lat, lon), norte arriba, sin heading (la telemetría no trae
      IMU). La longitud es ≈ ±10 % por esqueletización.
      v2 (2026-09-21): el pipeline persiste las DETECCIONES por frame en
      telemetry.jsonl (tipo + xyxy en píxeles nativos). Con eso el motor
      responde conteo de personas por posición (dentro de la zona dibujada),
      personas a ≤ r metros de un objeto y distancia mínima/media
      persona→objeto. Convención: punto de apoyo = centro-abajo del bbox (sin
      pose ni orientación, declarado en la respuesta). Si la misión no trae
      detecciones, el conteo cae al total por frame del CSV y las consultas con
      posición se rechazan explícitamente; la demo sintética las genera.
      El radio del buffer se acota a la diagonal del frame: una consulta de
      "200 m" sobre frames de pocos metros devuelve el frame completo, no un
      kernel gigante (bug real detectado con la demo y corregido).
      Las consultas de vías tienen especialista propio (train_road_specialist.py,
      2 clases sobre FloodNet road, split 80/20 seed 42 idéntico al del flood).
      Gate acordado: IoU de vía en FloodNet val ≥ 0.50. Resultado: FloodNet-only
      PASA con 0.515; la variante mixta FloodNet+LoveDA daba 0.489 (no pasaba)
      y 0.532 en LoveDA, o sea que mezclar dominios empeoraba el dominio UAV de
      medición sin ganar lo suficiente, así que se integra la FloodNet-only.
      ⚠ Cross-domain LoveDA medido: 0.169 — los números de vía sobre frames
      satelitales/oblicuos son indicativos; el dominio válido es UAV/inundación.
      El modelo NO vuela: corre en post_flight (--vias-onnx) y su máscara va a
      entrega/masks/<src>_vias.png (contrato v3).

  - id: mil-tipo-desastre
    estado: vigente
    texto: |
      MIL para el tipo de desastre (bolsa = evento, instancias = tiles, pooling
      con atención gatada) probado contra el clasificador por tile con el MISMO
      LOEO (24 eventos, seed 42): media ponderada de accuracy por bolsa 0.3277
      vs 0.3681 del baseline por tile. NO lo supera: se documenta como técnica
      que no funcionó y el clasificador por tile queda. Re-run del baseline el
      2026-09-21: 0.330 (varianza run-to-run ±0.04 por no-determinismo de GPU),
      así que MIL 0.3277 queda DENTRO de la banda del baseline: tampoco gana con
      la referencia más nueva. Caveat registrado: la
      métrica de bolsa (accuracy por bolsa, ponderada por bolsas) no es idéntica
      a la de tile (ponderada por tiles); 6 épocas y K=8 con eventos chicos de
      alta varianza. JSON: outputs/mil_loeo.json. Per-eventos donde sí gana:
      moore-tornado, socal-fire, woolsey-fire y palu-tsunami (acc bolsa 0.95-1.0).

  - id: performance-pi
    estado: vigente
    texto: |
      --no-damage apaga de verdad los tres modelos de daño + siamés + flood.
      Antes --no-detect sólo apagaba YOLO y todo lo demás corría igual por
      frame. Además el flood specialist se ejecutaba DOS veces por frame (una en
      la rama de diagnóstico y otra en el bloque del sampler) y el tensor del
      baseline siamés se releía y reprocesaba en cada frame aunque la imagen no
      cambia. Los tres eran cuellos de botella en la Pi Zero 2 W.

limitaciones:
  - id: agua-turbia
    texto: "Agua turbia/barrosa puede clasificarse como bare_ground (LoveDA tiene agua azulada)."

  - id: senderos
    texto: "Senderos angostos (< ~1 px a 320x320) se absorben en la clase dominante del entorno."

  - id: personas-altitud
    texto: |
      Detección de personas válida sólo a baja altitud; en tiles satelitales las
      personas son sub-píxel. Los conteos de los simulacros hechos sobre LoveDA
      Test NO son significativos y no deberían citarse como resultado.

  - id: alucinacion-nodata
    texto: |
      El modelo "alucina" clases sobre regiones sin datos; se excluyen con
      máscara de validez. Con la máscara nueva (sólo borde) un frame entero
      oscuro produce el veredicto "SIN DATOS" en vez de "ZONA SALUDABLE", que es
      lo que daba antes.

  - id: clase-other
    texto: "La clase 'other' agrupa calles y estructuras; no existe clase 'road' propia."

  - id: usi-sin-acotar
    texto: |
      USI no está acotado a [0,1]: es el cociente bui/veg con un piso de 0.1 en
      el denominador, así que puede valer cientos (bui=50%, veg~0 → USI=500).
      Para mostrar una barra 0-1 usar usi_norm, que satura en USI=300. El
      tooltip del frontend decía "0 = natural, 1 = todo construido", lo cual era
      falso; se corrigió.

  - id: gvi-agua
    texto: |
      GVI no distingue agua de suelo desnudo (ambos dan ~-1 cuando veg=0). Por
      eso el veredicto SUELO EXPUESTO exige además agua < 25%: un lago ya no
      sale como "suelo expuesto". Tampoco hay un veredicto propio para agua;
      cae en ZONA SALUDABLE, que es discutible y conviene revisar si el jurado
      lo pregunta.

  - id: calibracion-tipo
    estado: vigente
    texto: |
      Calibración del clasificador de tipo (cansat/calibracion.py sobre el LOEO
      con las 7 probabilidades por tile, `--probs-todas`). ECE de evaluación
      0.473 → 0.123 con temperature scaling (T=13.1 global; por dominio xbd
      5.63, crasar y kate_pd saturan el techo del grid), NLL 3.39 → 1.66: las
      probabilidades crudas están muy sobre-confiadas (accuracy LOEO 0.33 con
      confianza ~0.9). HALLAZGO: para la política de incendio (score binario
      p_incendio) la temperatura es MONÓTONA, así que NO cambia la decisión:
      τ pasa de 0.998 a 0.690 pero el conjunto aceptado es idéntico (recall
      0.260 y FPR 5.0 % en ambos). Mejora las confianzas que se muestran, no la
      política validada; por eso no se cablea al vuelo. Los sets adaptativos
      (APS) con este clasificador dan set medio = 7 (todas las clases): la
      cobertura se cumple trivialmente y confirman que el cuello es la accuracy
      del tipo, no la calibración. Evidencia:
      docs/benchmarks/calibracion_tipo.json. Baseline LOEO re-medido en la
      misma corrida: 0.330 (ver `mil-tipo-desastre`).

  - id: tipo-balanceado
    estado: vigente
    texto: |
      Rebalanceo del clasificador de tipo (train_disaster_type.py --loss
      balanceada/focal, pesos inversos topados en 5.0): LOEO 0.317 vs 0.330
      del baseline con CE pelada, dentro de la banda de ruido run-to-run
      (±0.04). Por evento mejora 3 (portugal 0.22→0.53, midwest 0.28→0.56,
      pinery 0.21→0.38) pero hunde 4 (rescuenet 0.31→0.09, moore 0.85→0.61,
      palu 0.31→0.07, Cocodrie 0.78→0.54): redistribuye aciertos sin subir la
      media. El cuello es representación/dominio, no desbalance; focal no se
      corre (misma hipótesis ya testeada). NO se adopta; el checkpoint de
      producción sigue siendo el de CE. Para no perder una corrida de ~1 h si
      se corta, el LOEO acepta --eventos (tramos) + --loeo-json. Evidencia:
      docs/benchmarks/tipo_balanceado.json.

  - id: calibracion-por-clase
    estado: vigente
    texto: |
      Extensión con una T por clase (q_i ∝ p_i^(1/T_i), tools/calibrate_per_class.py,
      mismo split por eventos). NO se adopta: ECE de evaluación 0.131 vs 0.123
      de la global, NLL 2.02 vs 1.66 (peor), y NO preserva el ranking de
      p_incendio, así que cambiaría la política fire_only_v1 validada. El ajuste
      por clase sobre-amortigua: casi todas las T saturan el techo del grid
      (20.0) y volcán queda en T=1.0 por falta de muestras en calibración
      (n=0). Se documenta el experimento fallido en vez de cablearlo.
      Evidencia: docs/benchmarks/calibracion_por_clase.json.

  - id: ood-drift
    estado: vigente
    texto: |
      Aviso de fuera-de-distribución (OOD) por frame: proxy DECLARADO, no un
      detector formal. Compara la mezcla de clases del terreno (divergencia
      Jensen-Shannon) y los índices de color (ExG y sombras, z-score) contra una
      referencia construida sobre LoveDA **Val** (nunca Train) con
      tools/build_ood_reference.py → docs/benchmarks/ood_loveda_val.json.
      Referencia medida: clases_prom [veg 0.362, bui 0.073, wat 0.116,
      bare 0.092, oth 0.357]; JS media 0.176 y umbral p95 0.380; ExG 38.0±16.0;
      sombras 13.5±11.9. El umbral JS es alto porque Val mezcla urbano y rural:
      el aviso salta con escenas muy distintas (desierto, nieve, noche) o con
      índices de color a >3σ. Viaja en el JSONL (ood_score/ood_flag) y la
      estación muestra el badge "fuera de distribución"; NO bloquea nada ni
      cambia decisiones: advierte que los números de Val podrían no aplicar.
      Si falta el JSON de referencia, el campo va en None (no se inventa).

  - id: perfil-vuelo
    estado: vigente
    texto: |
      Perfiles de vuelo en mission_pipeline: --perfil completo (default, el
      validado: terreno + daño/flood/fuego/severidad con consenso) y
      --perfil rapido (terreno @224 + detección + estrés, sin TTA/CRF/vis ni
      modelos de daño). Rápido NO emite veredicto de daño: sirve para la Pi
      cuando el s/frame medido obligue a recortar, y así se documenta en
      pi/guia_pi.md. El mapeo está en PERFILES/aplicar_perfil() con tests.

  - id: active-learning
    estado: vigente
    texto: |
      Cola de anotación para cuando existan vuelos reales (active learning
      mínimo): cansat/active.py puntúa cada frame con entropía del modelo de
      terreno (0.5) + rareza de la mezcla de clases contra la referencia de
      LoveDA Val (0.3) + estrés ambiental (0.2), y
      tools/select_tiles_for_annotation.py escribe un CSV ordenado con motivos
      (no copia frames). Sin labels de vuelo todavía no se re-entrena: la cola
      es lo que se anota primero después del primer vuelo.

  - id: benchmark-parser
    estado: vigente
    texto: |
      Benchmark del parser contra los QA reales de EarthVQA (Val, 57 202
      preguntas = 51 distintas; dataset gated, QA local en dataset/earthvqa/,
      uso académico no comercial). Herramienta: tools/bench_parser_earthvqa.py.
      Cobertura: 41.4 % global; Basic Counting 85.7 % y Basic Judging 85.7 %
      (falta solo 'playground', que no existe en la ontología de 5 clases);
      Reasoning-based Judging 16.3 % (agricultural land/woodland/uncultered →
      vegetación/vegetación/suelo); Comprehensive, Object Situation y
      Reasoning Counting 0 % (tipos, usos de suelo, intersecciones, eutrófico:
      fuera de alcance, se rechazan). Precisión de mapeo 100 % (15/15) y de
      rechazo 100 % (36/36) sobre el inventario COMPLETO de 51 preguntas
      distintas, etiquetado a mano. Dos falsos soportes detectados a escala y
      corregidos antes de medir: 'uncultivated agricultural land' (es barbecho
      → suelo, no vegetación) y 'construction land/area' (uso de suelo: se
      rechaza). Aproximaciones declaradas: agriculture/woodland→vegetación y
      uncultivated→suelo; 'roads' usa el especialista de vías (cross-domain
      LoveDA 0.169). NO mide exactitud de respuesta VQA. Evidencia versionada:
      docs/benchmarks/earthvqa_parser.json y la muestra adjudicada a mano
      docs/benchmarks/earthvqa_parser_muestra_51.csv.

  - id: opencv-5-dnn
    texto: |
      OpenCV 5.0.0 NO es confiable con el backend cv2.dnn del proyecto. Medido
      el 2026-09-21 sobre cansat_seg_terrain_v2.onnx: logits absurdos (~1e14,
      argmax coincide 0.01 con onnxruntime y diferencia máxima 5.8e14), mientras
      que OpenCV 4.13 coincide >0.99. Como la Pi Zero v1 usa cv2.dnn (no hay
      wheels de onnxruntime para ARMv6), requirements-flight.txt y
      requirements.txt fijan opencv<5 y cansat/onnxio.py avisa al cargar el
      backend con cv2>=5. El pin es requisito de vuelo, no estética; el test de
      equivalencia entre backends queda marcado slow porque necesita el ONNX de
      vuelo (no versionado).

  - id: pseudo-labels-descartado
    texto: |
      Regenerar pseudo-labels y re-destilar NO se persigue. Evidencia: la
      destilación (KD) ya empató con el modelo de vuelo (0.5196 vs 0.5219 mIoU)
      y el pipeline viejo de pseudo-labels quedó congelado en legacy/ con su
      defecto documentado (BN congelado, etiquetas desalineadas 1/3). Reabrirlo
      sin cambiar la causa raíz es exactamente el error que este repo decidió
      no repetir.

  - id: baseline-dominio
    texto: |
      El baseline siamés (outputs/baseline.png) es un tile satelital nadir de
      Esri World Imagery a zoom 18 (~0.6 m/px, 640x640 → ~380 m de lado), y los
      frames de vuelo son oblicuos desde ~250 m con otro FOV y otra resolución.
      El cambio de dominio hace que el siamés tienda a marcar "cambio" en todas
      partes. Tratar su salida como señal débil, no como prueba.

  - id: licencia-xbd
    texto: |
      Los modelos de daño se entrenaron con xBD (CC BY-NC-SA 4.0), que es
      atribución + no comercial + compartir igual. Los pesos derivados heredan
      esa licencia. LoveDA en cambio es CC BY 4.0 (sin restricción comercial).
      Ver la sección "Datasets y licencias" del README antes de distribuir nada.

  - id: siamesa-fallback
    texto: |
      train_siamese_damage.py tenía un fallback `pre, post = img, img` cuando
      faltaba el par pre/post, o sea que entrenaba a la red a predecir daño
      donde NO hay ningún cambio. Corregido (ahora skipea la muestra), pero los
      pesos best_siamese_damage.pth ya entrenados arrastran ese defecto:
      re-entrenar antes de confiar en el siamés.

  - id: aug-uav-dano
    estado: vigente
    texto: |
      Augmentación UAV para el daño de vuelo: ops nuevas `sombras` (parches
      poligonales oscurecidos) y `vibracion` (±3 px + ±0.4°, geométrica con
      máscara) en cansat/corrupt.py como FUENTE ÚNICA (entrenar y evaluar con
      la misma implementación), subset AUG_UAV = motion_blur/escala/sombras/
      vibracion, hook --aug-uav en train_damage_v3.py (default apagado).
      Baseline medido (dano2, RescueNet val, n=60): limpio IoU bin 0.374;
      motion_blur -0.021, escala -0.026, sombras -0.001, vibracion -0.006.
      Fine-tune desde best_damage3_bal.pth con aug (1 época, lr 1e-4): limpio
      0.265 (-0.109), motion_blur -0.034, escala +0.000. NO SE ADOPTA: degrada
      el limpio. Causas probables: mismatch de receta (init de train_damage_v2,
      fine-tune con v3), 1 época insuficiente y aug agresiva (escala 0.45-0.60
      con p=0.35×4 ops). El A/B correcto (mismo init, misma receta ± aug,
      schedule largo) queda para V11. Evidencia:
      docs/benchmarks/aug_uav_dano.json.

  - id: confianza-estres
    estado: vigente
    texto: |
      El estrés ambiental degrada los modelos (suite: niebla/lluvia hunden el
      mIoU) y eso está bien: lo que faltaba era que el SISTEMA LO DIGA. Desde
      2026-09-22 `build_summary` agrega `confianza_limitada` (aditivo, no sube
      el schema v3): frames con haze_pct ≥ 45 (BRUMA DENSA, ST.CONTAM_DENSA) o
      humidex ≥ 46 (PELIGROSO, ST.HEAT_PELIGRO), con motivos por frame y la
      nota "interpretar con cautela". No cambia ningún veredicto. La estación
      lo muestra en el Informe (sección sin número) y la demo lo trae con
      n_frames 0 (su bruma máxima es 27 %). Espejo TS en summarySchema.ts.

  - id: uart-heltec
    estado: vigente
    texto: |
      Firmware emisor del contrato LB135 v2 para Heltec WiFi LoRa 32 V3
      (firmware/heltec_lb135_uart/, PlatformIO): 1 paquete/s con perfil de
      descenso simulado DECLARADO (no son sensores reales) y checksum NMEA.
      El formato se validó contra cansat/protocol.py (parse + checksum + fix).
      Sale por USB-serie: en la PC se lee como COMx y en la Pi como
      /dev/ttyACM0, sin pelear con pines GPIO. Cadena probada en PC:
      sim_uart → uart_listener --stdin → uart_state.json (12/12 paquetes).
      PENDIENTE: flashear la placa, probar el listener contra el Heltec real
      y el cableado GPIO directo (TX→GPIO15); ver pi/guia_pi.md §8.

  - id: gradcam-estacion
    estado: vigente
    texto: |
      Explicabilidad del daño integrada a la estación (2026-09-22): endpoint
      GET /api/gradcam (src, modelo=dano2|dano, clase opcional) que invoca
      tools/gradcam.py por subproceso con el venv de vuelo (la estación sigue
      stdlib-only), cachea el PNG en outputs/gradcam/ y lo sirve por /img/.
      El Detalle del frame tiene botón "explicar (Grad-CAM)" con selector de
      modelo (vuelo/xBD) y overlay mostrar/ocultar; el resultado vale solo para
      su frame y la petición se aborta al navegar. Primera generación ~13 s en
      CPU, después cache. Sin torch/checkpoint degrada con error claro.
      Evidencia: docs/evidencia/10_gradcam.png.

  - id: pi-hardware
    estado: vigente
    texto: |
      Puesta a punto REAL de la Pi Zero W v1 (2026-09-25): Raspbian 13 Trixie
      (no Bookworm; imx500-all 1.13 está disponible y quedó instalado),
      OpenCV 4.10 de apt (cv2.dnn; no hay onnxruntime para ARMv6), venv
      --system-site-packages, pyserial/PyYAML, 426 MB RAM, SD 16 GB clase 10,
      `vcgencmd get_throttled` = 0x0 (fuente estable), temp 38 °C. Se apagó el
      escritorio (la imagen era Desktop): `systemctl set-default
      multi-user.target` + lightdm disabled (reversible). `dist_pi` viaja con
      tiles de prueba y `tools/bench_models.py`. Medición de la placa en
      docs/benchmarks/pi_zero_w_sframe.json. PENDIENTE: AI Camera (IMX500) y
      UART real (el S3 está disponible; la Heltec no).

  - id: modelo-vuelo-tiny
    estado: vigente
    texto: |
      MEDICIÓN 2026-09-25 en la placa: el terreno `tiny` (LR-ASPP MV3-S @224)
      tarda 1.77 s de segmentación y ~3.0 s/frame total (ms_seg/ms_total del
      telemetry.jsonl; 3 frames: 5289/2988/2994 ms). El `v2@224` (DeepLabV3+
      MV2) tarda ~243 s por inferencia: 80× más. En ARMv6 sin NEON la familia
      DeepLabV3+ MV2 (daño, flood, fuego, severidad) NO es viable a bordo
      (~4 min/frame c/u). DECISIÓN: el vuelo por CPU usa el tiny@224 (mIoU
      0.4397, -6 pts vs 0.4996, se declara) y el resto de la IA corre
      POST-VUELO en la PC sobre los frames capturados. El DPD no exige IA en
      tiempo real a bordo (ver V8.1). Con ~3 s/frame y 1–2 min de descenso dan
      20–40 frames. Evidencia: docs/benchmarks/pi_zero_w_sframe.json; guía
      actualizada en pi/guia_pi.md §6.

