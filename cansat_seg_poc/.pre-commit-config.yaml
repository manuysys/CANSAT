# ═══════════════════════════════════════════════════════════════════════════
#  Pre-commit — no existía.
# ═══════════════════════════════════════════════════════════════════════════
#  Instalación (una vez):
#      pip install pre-commit && pre-commit install
#  Corrida manual sobre todo:
#      pre-commit run --all-files
# ═══════════════════════════════════════════════════════════════════════════
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=2048"]   # los pesos NO van al repo; ver MODELS.yaml
      - id: check-merge-conflict
      - id: debug-statements       # breakpoint() / pdb olvidados
      - id: check-case-conflict

  - repo: local
    hooks:
      # El "informe al día" se verifica ACÁ y no en CI: depende de outputs/ y
      # entrega/ (no versionados) y del mtime local. Si cambia una decisión o
      # una métrica, el hook regenera y compara.
      - id: generate-report-check
        name: informe de pruebas al día (generate_report --check)
        entry: python cansat_seg_poc/generate_report.py --check
        language: system
        pass_filenames: false
        files: ^cansat_seg_poc/(docs/decisiones\.yaml|docs/reporte_pruebas\.md|MODELS\.yaml|outputs/metrics/.*\.json)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Misma versión que el CI (.github/workflows/ci.yml) y que el ruff local:
    # antes estaba en v0.5.7 y el CI instalaba la última, así que el pre-commit
    # daba verde y el CI rojo por reglas nuevas (RUF046/RUF059).
    rev: v0.16.8
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
